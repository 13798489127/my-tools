<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🔧 集合工具 · 分隔符统一 & 数据处理</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f4f9;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 16px 36px rgba(0, 20, 40, 0.06);
            padding: 28px 32px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        h1 .badge {
            font-size: 0.75rem;
            font-weight: 500;
            background: #eef3fb;
            color: #3b6cb4;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .subtitle {
            color: #556f8a;
            margin-bottom: 24px;
            font-size: 0.9rem;
            border-left: 4px solid #3b82f6;
            padding-left: 14px;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }
        @media (max-width: 800px) {
            .tool-grid {
                grid-template-columns: 1fr;
            }
            .app-container {
                padding: 18px 16px;
            }
        }
        .panel {
            background: #fafcff;
            border-radius: 18px;
            border: 1px solid #e4ecf5;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
        }
        .panel.full-width {
            grid-column: 1 / -1;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .panel-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 14px 16px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.88rem;
            line-height: 1.6;
            border: 1.5px solid #d8e3f0;
            border-radius: 14px;
            background: white;
            resize: vertical;
            outline: none;
            transition: 0.15s;
        }
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
        }
        textarea.output-area {
            background: #f9fbfd;
            color: #1e3a5f;
            font-weight: 500;
        }
        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            margin: 12px 0;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.88rem;
            color: #334e68;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            border: 1.5px solid #cbd5e1;
            background: white;
            color: #1e293b;
            white-space: nowrap;
        }
        .btn:hover {
            background: #f8fafd;
            border-color: #b0c4d8;
        }
        .btn-primary {
            background: #1e3a5f;
            border-color: #1e3a5f;
            color: white;
            box-shadow: 0 4px 10px rgba(30,58,95,0.12);
        }
        .btn-primary:hover {
            background: #143048;
            border-color: #143048;
        }
        .btn-accent {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
            box-shadow: 0 4px 10px rgba(37,99,235,0.14);
        }
        .btn-accent:hover {
            background: #1d4ed8;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            font-size: 0.85rem;
            color: #4a6a88;
            margin-top: 8px;
        }
        .stats-bar span {
            background: #eef3fa;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        .stats-bar .count {
            color: #1e40af;
            font-weight: 700;
        }
        .divider {
            border-top: 1px solid #e2eaf4;
            margin: 16px 0;
        }
        .tag {
            display: inline-block;
            font-size: 0.7rem;
            background: #dbeafe;
            color: #1e40af;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 500;
        }
        .highlight-num {
            font-weight: 700;
            color: #2563eb;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1>
        🔧 集合工具
        <span class="badge">分隔符统一 · 数据处理</span>
    </h1>
    <div class="subtitle">将中文逗号、顿号、制表符、换行符、连续空格等统一转为英文逗号 <code>,</code> — 支持去重/排序/统计</div>

    <!-- 主工具区域 -->
    <div class="tool-grid">
        <!-- 输入面板 -->
        <div class="panel">
            <div class="panel-header">
                <h3>📥 原始输入</h3>
                <span class="tag">支持任意分隔符混用</span>
            </div>
            <textarea id="input-area" placeholder="在此粘贴数据...&#10;&#10;示例：&#10;5301129800001306&#10;5301129800001305&#10;5301129800001303&#10;&#10;或：&#10;值1，值2、值3  值4&#9;值5">5301129800001306
5301129800001305
5301129800001303</textarea>
            <div class="button-group" style="margin-top:10px;">
                <button class="btn btn-primary" id="process-btn">🔄 统一转换</button>
                <button class="btn" id="clear-input-btn">🗑️ 清空输入</button>
                <button class="btn" id="load-sample-btn">📋 加载复杂示例</button>
            </div>
        </div>

        <!-- 输出面板 -->
        <div class="panel">
            <div class="panel-header">
                <h3>📤 处理结果</h3>
                <span id="result-count-tag" class="tag">0 项</span>
            </div>
            <textarea id="output-area" class="output-area" placeholder="转换后的结果将显示在这里..." readonly></textarea>
            <div class="button-group" style="margin-top:10px;">
                <button class="btn btn-accent" id="copy-btn">📋 一键复制</button>
                <button class="btn" id="copy-quoted-btn">📋 复制(带引号)</button>
                <button class="btn btn-sm" id="clear-output-btn">清空</button>
            </div>
            <div class="stats-bar" id="stats-bar" style="margin-top:10px;">
                <span>结果数量: <b class="count" id="count-num">0</b></span>
                <span>去重后: <b class="count" id="unique-num">0</b></span>
            </div>
        </div>

        <!-- 选项面板 - 全宽 -->
        <div class="panel full-width" style="padding:14px 20px;">
            <div class="panel-header" style="margin-bottom:4px;">
                <h3>⚙️ 处理选项</h3>
            </div>
            <div class="options-row">
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-dedup" checked>
                    <span>🔹 去重 (保留唯一值)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-sort">
                    <span>🔸 排序 (数字按数值 / 文本按字典)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-trim" checked>
                    <span>✂️ 去除首尾空格</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-remove-empty" checked>
                    <span>🚫 移除空值</span>
                </label>
            </div>
            <div class="options-row" style="margin-top:2px;">
                <span style="font-size:0.82rem; color:#55708f;">💡 替换规则：中文逗号<code>，</code> 顿号<code>、</code> 制表符<code>\t</code> 换行<code>\n</code> 连续空格 → 英文逗号<code>,</code></span>
            </div>
        </div>
    </div>

    <!-- 功能扩展区：快速预览列表 -->
    <div class="panel full-width" style="margin-top:18px; padding:16px 20px;">
        <div class="panel-header" style="margin-bottom:8px;">
            <h3>📋 结果列表预览 <span style="font-weight:400; font-size:0.8rem; color:#6b85a0;">(前50项)</span></h3>
            <button class="btn btn-sm" id="refresh-preview-btn">🔄 刷新预览</button>
        </div>
        <div id="preview-list" style="display:flex; flex-wrap:wrap; gap:8px; max-height:180px; overflow-y:auto; padding:8px 0;">
            <span style="color:#8a9db5;">等待处理…</span>
        </div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- DOM 元素 ----------
        const inputArea = document.getElementById('input-area');
        const outputArea = document.getElementById('output-area');
        const processBtn = document.getElementById('process-btn');
        const clearInputBtn = document.getElementById('clear-input-btn');
        const loadSampleBtn = document.getElementById('load-sample-btn');
        const copyBtn = document.getElementById('copy-btn');
        const copyQuotedBtn = document.getElementById('copy-quoted-btn');
        const clearOutputBtn = document.getElementById('clear-output-btn');
        const resultCountTag = document.getElementById('result-count-tag');
        const countNum = document.getElementById('count-num');
        const uniqueNum = document.getElementById('unique-num');
        const previewList = document.getElementById('preview-list');
        const refreshPreviewBtn = document.getElementById('refresh-preview-btn');

        // 选项
        const optDedup = document.getElementById('opt-dedup');
        const optSort = document.getElementById('opt-sort');
        const optTrim = document.getElementById('opt-trim');
        const optRemoveEmpty = document.getElementById('opt-remove-empty');

        // ---------- 核心处理函数 ----------
        function processString(input) {
            if (!input || !input.trim()) {
                return [];
            }

            let str = input;

            // 1. 统一换行符：\r\n → \n
            str = str.replace(/\r\n/g, '\n');
            // 2. 将中文逗号、顿号、制表符、换行符 都替换为英文逗号
            //    中文逗号：， (U+FF0C)
            //    顿号：、 (U+3001)
            //    制表符：\t
            //    换行符：\n
            str = str.replace(/[\uFF0C\u3001\t\n]/g, ',');

            // 3. 处理连续空格（2个及以上空格 → 逗号）
            //    同时也处理单个空格？用户说"单个连续或连续空格"，意思是单个空格和连续空格都改。
            //    但要注意：如果数据项内部本身有空格（比如"hello world"），替换为逗号可能会破坏数据。
            //    通常情况下这种工具是按分隔符处理，我们来把"连续空格"（包括单个空格作为分隔符的情况）替换。
            //    策略：将 1个及以上连续空格 → 逗号
            //    但为了不过度替换数字中的空格（少见），我们执行：连续空格 → 逗号
            str = str.replace(/[ ]{1,}/g, ',');

            // 4. 处理连续的多个逗号 → 单个逗号
            str = str.replace(/,{2,}/g, ',');

            // 5. 按逗号拆分
            let items = str.split(',');

            // 6. 去除首尾空格（如果选项开启）
            if (optTrim.checked) {
                items = items.map(item => item.trim());
            }

            // 7. 移除空值（如果选项开启）
            if (optRemoveEmpty.checked) {
                items = items.filter(item => item !== '');
            }

            // 8. 去重（如果选项开启）
            if (optDedup.checked) {
                const seen = new Set();
                items = items.filter(item => {
                    if (seen.has(item)) return false;
                    seen.add(item);
                    return true;
                });
            }

            // 9. 排序（如果选项开启）
            if (optSort.checked && items.length > 0) {
                // 尝试数字排序：如果所有项都可解析为数字，则按数值排序
                const allNumeric = items.every(item => {
                    const num = parseFloat(item);
                    return !isNaN(num) && isFinite(num) && String(num).trim() === item.trim();
                });
                if (allNumeric) {
                    items.sort((a, b) => parseFloat(a) - parseFloat(b));
                } else {
                    items.sort((a, b) => a.localeCompare(b, 'zh-CN', { numeric: true }));
                }
            }

            return items;
        }

        function updateOutput(items) {
            const result = items.join(',');
            outputArea.value = result;
            resultCountTag.textContent = `${items.length} 项`;
            countNum.textContent = items.length;
            // 去重后数量与结果数量一致（因为去重已在处理中完成或未开启）
            uniqueNum.textContent = optDedup.checked ? items.length : (() => {
                const s = new Set(items);
                return s.size;
            })();
            updatePreview(items);
        }

        function updatePreview(items) {
            const displayItems = items.slice(0, 50);
            if (displayItems.length === 0) {
                previewList.innerHTML = '<span style="color:#8a9db5;">暂无结果</span>';
                return;
            }
            let html = '';
            displayItems.forEach((item, idx) => {
                const display = item.length > 30 ? item.substring(0, 30) + '…' : item;
                html += `<span style="background:#eef3fb; color:#1e3a5f; padding:4px 10px; border-radius:14px; font-size:0.82rem; font-family:monospace; border:1px solid #dbe4f0;" title="${item.replace(/"/g, '&quot;')}">${idx+1}. ${display}</span>`;
            });
            if (items.length > 50) {
                html += `<span style="color:#6b85a0; font-size:0.8rem; align-self:center;">…共 ${items.length} 项</span>`;
            }
            previewList.innerHTML = html;
        }

        function handleProcess() {
            const input = inputArea.value;
            const items = processString(input);
            updateOutput(items);
        }

        // ---------- 事件绑定 ----------
        processBtn.addEventListener('click', handleProcess);

        clearInputBtn.addEventListener('click', () => {
            inputArea.value = '';
            outputArea.value = '';
            resultCountTag.textContent = '0 项';
            countNum.textContent = '0';
            uniqueNum.textContent = '0';
            previewList.innerHTML = '<span style="color:#8a9db5;">等待处理…</span>';
        });

        clearOutputBtn.addEventListener('click', () => {
            outputArea.value = '';
            resultCountTag.textContent = '0 项';
            countNum.textContent = '0';
            uniqueNum.textContent = '0';
            previewList.innerHTML = '<span style="color:#8a9db5;">结果已清空</span>';
        });

        loadSampleBtn.addEventListener('click', () => {
            inputArea.value = `5301129800001306
5301129800001305
5301129800001303
、
5301129800001308，5301129800001306
5301129800001310	5301129800001311
值A   值B  值C
hello world，foo、bar	baz
重复项  重复项
12345
67890`;
            handleProcess();
        });

        // 复制功能
        copyBtn.addEventListener('click', async () => {
            const text = outputArea.value;
            if (!text) {
                alert('没有可复制的内容，请先执行转换。');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                showToast('✅ 已复制到剪贴板');
            } catch {
                fallbackCopy(text);
                showToast('✅ 已复制 (降级方式)');
            }
        });

        copyQuotedBtn.addEventListener('click', async () => {
            const text = outputArea.value;
            if (!text) {
                alert('没有可复制的内容，请先执行转换。');
                return;
            }
            const items = text.split(',').filter(s => s !== '');
            const quoted = items.map(item => `"${item.replace(/"/g, '\\"')}"`).join(',');
            try {
                await navigator.clipboard.writeText(quoted);
                showToast('✅ 已复制带引号版本');
            } catch {
                fallbackCopy(quoted);
                showToast('✅ 已复制 (降级方式)');
            }
        });

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }

        function showToast(msg) {
            let toast = document.getElementById('toast-msg');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast-msg';
                toast.style.cssText = `
                    position: fixed;
                    bottom: 30px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #1e3a5f;
                    color: white;
                    padding: 10px 24px;
                    border-radius: 30px;
                    font-size: 0.9rem;
                    font-weight: 500;
                    z-index: 9999;
                    opacity: 0;
                    transition: opacity 0.25s;
                    pointer-events: none;
                    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
                `;
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.opacity = '0';
            }, 1800);
        }

        refreshPreviewBtn.addEventListener('click', () => {
            const items = outputArea.value ? outputArea.value.split(',').filter(s => s !== '') : [];
            updatePreview(items);
        });

        // 选项变更时自动重新处理
        [optDedup, optSort, optTrim, optRemoveEmpty].forEach(opt => {
            opt.addEventListener('change', () => {
                if (inputArea.value.trim()) {
                    handleProcess();
                }
            });
        });

        // Ctrl+Enter 快捷键触发处理
        inputArea.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                handleProcess();
            }
        });

        // ---------- 初始化 ----------
        // 页面加载时自动处理默认示例
        function initialize() {
            if (inputArea.value.trim()) {
                handleProcess();
            }
        }
        initialize();

        // 额外：输出区域点击全选
        outputArea.addEventListener('click', function() {
            this.select();
        });
        outputArea.addEventListener('focus', function() {
            this.select();
        });

        console.log('🔧 集合工具已就绪 · 分隔符统一转换');
        console.log('  支持：中文逗号 顿号 制表符 换行符 连续空格 → 英文逗号');
        console.log('  快捷键：Ctrl+Enter 触发转换');
    })();
</script>
</body>
</html>
