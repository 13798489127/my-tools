<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单数据解析导出工具</title>
    <!-- SheetJS CDN -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #409EFF;
            --primary-hover: #337ecc;
            --success: #67c23a;
            --warning: #e6a23c;
            --danger: #f56c6c;
            --text: #303133;
            --text-secondary: #606266;
            --text-muted: #909399;
            --border: #dcdfe6;
            --border-light: #e4e7ed;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 8px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* Header */
        .app-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .app-header .logo-icon {
            font-size: 42px;
            margin-bottom: 4px;
        }

        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .app-header .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            font-size: 18px;
        }

        /* Textarea */
        .input-area {
            width: 100%;
            min-height: 200px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
            transition: var(--transition);
            color: var(--text);
            background: #fafbfc;
        }

        .input-area:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1);
            background: #fff;
        }

        .input-area::placeholder {
            color: #c0c4cc;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            white-space: nowrap;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 14px rgba(64, 158, 255, 0.35);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-success:hover {
            background: #5daf34;
            box-shadow: 0 4px 14px rgba(103, 194, 58, 0.35);
        }

        .btn-warning {
            background: var(--warning);
            color: #fff;
        }

        .btn-warning:hover {
            background: #d4932e;
            box-shadow: 0 4px 14px rgba(230, 162, 60, 0.35);
        }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: #ecf5ff;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Stats */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 12px;
        }

        .stat-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: #f5f7fa;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        .stat-chip .val {
            font-weight: 700;
            color: var(--primary);
        }

        /* Table Container */
        .table-wrapper {
            overflow-x: auto;
            max-height: 65vh;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            -webkit-overflow-scrolling: touch;
        }

        .table-wrapper table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
            font-size: 13px;
            white-space: nowrap;
        }

        .table-wrapper thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-wrapper thead th {
            background: #f5f7fa;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 12px 10px;
            border-bottom: 2px solid var(--border);
            text-align: center;
            white-space: nowrap;
            font-size: 12px;
            letter-spacing: 0.2px;
        }

        .table-wrapper tbody td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            text-align: center;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .table-wrapper tbody tr {
            transition: background 0.15s;
        }

        .table-wrapper tbody tr:hover {
            background: #f8fafd;
        }

        .table-wrapper tbody tr:nth-child(even) {
            background: #fafbfc;
        }

        .table-wrapper tbody tr:nth-child(even):hover {
            background: #f0f4f8;
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .status-VISIT {
            background: #ecf5ff;
            color: #409EFF;
        }

        .status-AFFIRM {
            background: #f0f9eb;
            color: #67c23a;
        }

        .status-DONE {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-ING {
            background: #fff7e6;
            color: #e6a23c;
        }

        .status-PAUSE {
            background: #fef0f0;
            color: #f56c6c;
        }

        .status-NOT {
            background: #f5f5f5;
            color: #909399;
        }

        .status-ROB {
            background: #e6f7ff;
            color: #1890ff;
        }

        .status-PEND {
            background: #fdf6ec;
            color: #d48806;
        }

        .status-CANCEL {
            background: #fee;
            color: #c00;
        }

        .status-BACK {
            background: #fff1f0;
            color: #cf1322;
        }

        .status-URGE {
            background: #fffbe6;
            color: #d46b08;
        }

        .status-default {
            background: #f5f5f5;
            color: #666;
        }

        /* Tooltip for truncated text */
        .cell-content {
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            cursor: default;
        }

        .cell-content:hover {
            position: relative;
            z-index: 20;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            pointer-events: none;
            animation: toastIn 0.35s ease, toastOut 0.35s ease 2.2s forwards;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .toast-success {
            background: #67c23a;
        }

        .toast-error {
            background: #f56c6c;
        }

        .toast-info {
            background: #409EFF;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                padding: 12px 8px 24px;
            }

            .card {
                padding: 14px;
            }

            .btn-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .table-wrapper table {
                font-size: 11px;
            }

            .table-wrapper thead th,
            .table-wrapper tbody td {
                padding: 6px 5px;
            }
        }

        /* Section divider */
        .section-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="logo-icon">📋</div>
            <h1>工单数据解析导出工具</h1>
            <p class="subtitle">粘贴工单JSON数据 → 自动解析 → 预览表格 → 导出Excel</p>
        </div>

        <!-- Input Card -->
        <div class="card">
            <div class="card-title"><span class="icon">📥</span>数据输入</div>
            <textarea id="jsonInput" class="input-area"
                placeholder='请粘贴工单JSON数据（支持单条对象或数组格式）&#10;&#10;示例格式：&#10;[{ "id": "xxx", "code": "WX2604280064", ... }]&#10;&#10;或单条对象：&#10;{ "id": "xxx", "code": "WX2604280064", ... }'></textarea>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="parseAndPreview()" title="解析JSON数据并生成预览表格">
                    🔍 解析数据
                </button>
                <button class="btn btn-outline" onclick="loadSampleData()" title="加载内置示例数据">
                    📦 加载示例数据
                </button>
                <button class="btn btn-warning" onclick="clearAll()" title="清空输入和预览">
                    🗑️ 清空全部
                </button>
                <button id="btnExport" class="btn btn-success" onclick="exportToExcel()" disabled
                    title="将解析后的数据导出为Excel文件">
                    📥 导出XLSX
                </button>
            </div>
            <div id="statsRow" class="stats-row" style="display:none;"></div>
        </div>

        <!-- Preview Card -->
        <div class="card" id="previewCard" style="display:none;">
            <div class="card-title">
                <span class="icon">📊</span>数据预览
                <span style="font-weight:400;font-size:12px;color:var(--text-muted);margin-left:8px;">
                    （横向滚动查看更多列，操作流水已平铺）
                </span>
            </div>
            <div class="table-wrapper" id="tableWrapper">
                <div class="empty-state">
                    <span class="icon">📭</span>
                    <p>暂无数据，请粘贴JSON后点击"解析数据"</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // ==================== 常量映射 ====================
            // 状态映射（recordList中的status -> 中文描述）
            const STATUS_MAP = {
                'NOT': { detailStatus: '故障登记', action: '' },
                'BACK': { detailStatus: '工单退回', actionFn: (item) => '退回; 退回说明：' + (item.describe || '暂无') },
                'URGE': { detailStatus: '工单催单', action: '催单' },
                'RECOVER': { detailStatus: '工单恢复', action: '恢复' },
                'WAIT': {
                    detailStatus: '工单转单', actionFn: (item) => '转单至：' + (item.groupName || '') + '; 挂起说明：' + (
                        item.describe || '暂无')
                },
                'ROB': { detailStatus: '工单抢单', action: '抢单' },
                'PEND': {
                    detailStatus: '工单派工',
                    action: '指派给维修人员：',
                    repairerFn: (item) => {
                        if (item.usersInfo && item.usersInfo.length > 0) {
                            return item.usersInfo
                                .filter(a => a.type === 'normal')
                                .map(a => a.realname + '(' + (a.phone || '无手机号') + ')')
                                .join(',');
                        }
                        return '';
                    }
                },
                'REPEND': {
                    detailStatus: '工单重派工',
                    action: '指派给维修人员：',
                    repairerFn: (item) => {
                        if (item.usersInfo && item.usersInfo.length > 0) {
                            return item.usersInfo
                                .filter(a => a.type === 'normal')
                                .map(a => a.realname + '(' + (a.phone || '无手机号') + ')')
                                .join(',');
                        }
                        return '';
                    }
                },
                'ING': { detailStatus: '开始维修', action: '进行处理' },
                'PAUSE': { detailStatus: '维修挂起', actionFn: (item) => '挂起; 挂起说明：' + (item.describe || '暂无') },
                'ASSIST': { detailStatus: '工单申请协助', action: '协助' },
                'CANCEL': { detailStatus: '工单取消', actionFn: (item) => '取消工单; 取消说明：' + (item.describe || '暂无') },
                'DONE': { detailStatus: '维修完工', actionFn: (item) => '完成维修工单处理; 完工描述：' + (item.describe || '暂无') },
                'AFFIRM': { detailStatus: '确认完工', action: '确认完工' },
                'REVIEW': { detailStatus: '维修评价', action: '完成评价' },
                'VISIT': { detailStatus: '工单回访', action: '进行工单回访' },
                'FEEDBACK': {
                    detailStatus: '滞留反馈',
                    actionFn: (item) => {
                        const feedback = (item.ext && item.ext.feedback) ? item.ext.feedback : '暂无';
                        const achieveTime = (item.ext && item.ext.achieveTime) ? item.ext.achieveTime.split(
                            ' ')[0] : '未知';
                        return '进行滞留反馈;反馈内容：' + feedback + ';预计完工日期' + achieveTime;
                    }
                },
            };

            // 工单类型映射
            const TYPE_NAME_MAP = {
                'COMM': '普通工单',
                'URGENT': '紧急工单',
                'VERY_URGENT': '非常紧急工单',
            };

            // 故障类型映射
            const MATTER_TYPE_MAP = {
                'OTHER': '其他',
                'ELECTRIC': '电气故障',
                'WATER': '水暖故障',
                'CARPENTRY': '木工维修',
                'LOCK': '门锁维修',
                'HVAC': '暖通空调',
                'PLUMBING': '管道疏通',
                'STRUCTURE': '结构维修',
            };

            // 紧急程度映射
            const PLEVEL_MAP = {
                'COMMON': '普通',
                'URGENT': '紧急',
                'VERY_URGENT': '非常紧急',
            };

            // 完工确认映射
            const DONE_AFFIRM_MAP = {
                0: '未确认',
                1: '确认中',
                2: '已确认',
            };

            // 平台映射
            const PLATFORM_MAP = {
                'BOXPHONE': '电话盒子',
                'WEB': '网页端',
                'MP_WX': '微信小程序',
                'APP': '移动APP',
            };

            // 全局解析结果存储
            let parsedWorkOrders = [];
            // 动态操作流水列定义（用于导出时保持一致）
            let dynamicFlowColumns = [];

            // ==================== 工具函数 ====================
            function parseTime(str) {
                if (!str) return null;
                // 支持 "YYYY-MM-DD HH:mm:ss" 和 ISO格式
                const normalized = str.replace(' ', 'T');
                const d = new Date(normalized);
                if (isNaN(d.getTime())) return null;
                return d;
            }

            function formatDateTime(d) {
                if (!d || isNaN(d.getTime())) return '';
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0');
                const mi = String(d.getMinutes()).padStart(2, '0');
                const ss = String(d.getSeconds()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
            }

            function timeDiffSeconds(d1, d2) {
                // d1 - d2，返回秒数
                if (!d1 || !d2 || isNaN(d1.getTime()) || isNaN(d2.getTime())) return null;
                return Math.round((d1.getTime() - d2.getTime()) / 1000);
            }

            function formatDuration(totalSeconds) {
                if (totalSeconds === null || totalSeconds === undefined || isNaN(totalSeconds)) return '';
                if (totalSeconds < 0) totalSeconds = 0;
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                const parts = [];
                if (hours > 0) parts.push(hours + '小时');
                if (minutes > 0) parts.push(minutes + '分钟');
                if (seconds > 0 || parts.length === 0) parts.push(seconds + '秒');
                return parts.join('');
            }

            function getStatusClass(status) {
                const clsMap = {
                    'VISIT': 'status-VISIT',
                    'AFFIRM': 'status-AFFIRM',
                    'DONE': 'status-DONE',
                    'ING': 'status-ING',
                    'PAUSE': 'status-PAUSE',
                    'NOT': 'status-NOT',
                    'ROB': 'status-ROB',
                    'PEND': 'status-PEND',
                    'REPEND': 'status-PEND',
                    'CANCEL': 'status-CANCEL',
                    'BACK': 'status-BACK',
                    'URGE': 'status-URGE',
                };
                return clsMap[status] || 'status-default';
            }

            function getStatusText(status) {
                const map = {
                    'NOT': '待处理',
                    'ROB': '已接单',
                    'PEND': '已派工',
                    'REPEND': '已重派工',
                    'ING': '维修中',
                    'PAUSE': '已挂起',
                    'RECOVER': '已恢复',
                    'DONE': '已完工',
                    'AFFIRM': '已确认',
                    'VISIT': '已回访',
                    'CANCEL': '已取消',
                    'BACK': '已退回',
                    'URGE': '已催单',
                    'WAIT': '已转单',
                    'ASSIST': '协助中',
                    'REVIEW': '已评价',
                    'FEEDBACK': '滞留反馈',
                };
                return map[status] || status;
            }

            // ==================== 核心解析逻辑 ====================
            function parseSingleOrder(order) {
                const result = {};

                // === 基础信息 ===
                result._code = order.code || '';
                result._createdAt = order.createdAt || '';
                result._deptName = order.deptName || '';
                result._objectName = order.objectName || '';
                result._typeName = order.typeName || '';
                result._matterType = MATTER_TYPE_MAP[order.matterType] || order.matterType || '';
                result._typeNotes = order.typeNotes || '';
                result._proposer = order.proposer || '';
                result._phone = order.phone || '';
                result._groupName = order.groupName || '';
                result._plevel = PLEVEL_MAP[order.plevel] || order.plevel || '';
                result._platform = PLATFORM_MAP[order.platform] || order.platform || '';
                result._updatedAt = order.updatedAt || '';
                result._manhour = order.manhour !== undefined ? order.manhour : 0;
                result._doneAffirm = DONE_AFFIRM_MAP[order.doneAffirm] || String(order.doneAffirm || '');
                result._status = getStatusText(order.status);
                result._statusRaw = order.status || '';
                result._address = order.address || '';
                result._areaName = order.areaName || '';
                result._repairerNames = order.repairerNames || '';

                // 维修人员（多个人逗号隔开，只留名称）
                if (order.usersInfo && order.usersInfo.length > 0) {
                    result._repairerNames = order.usersInfo
                        .filter(u => u.type === 'normal')
                        .map(u => u.realname)
                        .join(',');
                }
                if (!result._repairerNames && order._repairer) {
                    result._repairerNames = order._repairer;
                }

                // === 从recordList提取操作流水 ===
                const recordList = order.recordList || [];
                // 按createdAt排序（升序）
                const sortedRecords = [...recordList].sort((a, b) => {
                    const ta = parseTime(a.createdAt);
                    const tb = parseTime(b.createdAt);
                    if (!ta && !tb) return 0;
                    if (!ta) return 1;
                    if (!tb) return -1;
                    return ta - tb;
                });

                // 提取各状态时间
                const flowMap = {}; // { status: [时间字符串, ...] }
                for (const rec of sortedRecords) {
                    const st = rec.status;
                    if (!flowMap[st]) flowMap[st] = [];
                    flowMap[st].push(rec.createdAt);
                }

                // 单次状态（取第一次）
                const singleStatuses = ['NOT', 'ROB', 'PEND', 'REPEND', 'ING', 'DONE', 'AFFIRM', 'VISIT',
                    'BACK', 'URGE', 'WAIT', 'ASSIST', 'CANCEL', 'REVIEW', 'FEEDBACK'
                ];
                const flowTimes = {};
                for (const st of singleStatuses) {
                    if (flowMap[st] && flowMap[st].length > 0) {
                        flowTimes[st] = flowMap[st][0]; // 取第一次
                    } else {
                        flowTimes[st] = '';
                    }
                }

                // PAUSE和RECOVER配对
                const pauseList = flowMap['PAUSE'] || [];
                const recoverList = flowMap['RECOVER'] || [];
                const pauseRecoverPairs = [];
                // 按时间交错配对
                let pi = 0,
                    ri = 0;
                const allPauseRecover = [];
                for (const rec of sortedRecords) {
                    if (rec.status === 'PAUSE') allPauseRecover.push({ type: 'PAUSE', time: rec.createdAt });
                    if (rec.status === 'RECOVER') allPauseRecover.push({ type: 'RECOVER', time: rec.createdAt });
                }
                // 顺序配对：PAUSE后跟RECOVER
                let pendingPause = null;
                for (const item of allPauseRecover) {
                    if (item.type === 'PAUSE') {
                        if (pendingPause !== null) {
                            // 上一个PAUSE没有RECOVER，保存为未完成配对
                            pauseRecoverPairs.push({ pauseTime: pendingPause, recoverTime: '' });
                        }
                        pendingPause = item.time;
                    } else if (item.type === 'RECOVER') {
                        if (pendingPause !== null) {
                            pauseRecoverPairs.push({ pauseTime: pendingPause, recoverTime: item.time });
                            pendingPause = null;
                        } else {
                            // RECOVER没有对应的PAUSE，单独记录
                            pauseRecoverPairs.push({ pauseTime: '', recoverTime: item.time });
                        }
                    }
                }
                if (pendingPause !== null) {
                    pauseRecoverPairs.push({ pauseTime: pendingPause, recoverTime: '' });
                }

                // 将配对结果存入flowTimes
                for (let i = 0; i < pauseRecoverPairs.length; i++) {
                    const pair = pauseRecoverPairs[i];
                    flowTimes['PAUSE_' + (i + 1)] = pair.pauseTime;
                    flowTimes['RECOVER_' + (i + 1)] = pair.recoverTime;
                }
                // 记录最大配对索引
                const maxPairIndex = pauseRecoverPairs.length;

                result._flowTimes = flowTimes;
                result._maxPairIndex = maxPairIndex;
                result._sortedRecords = sortedRecords;

                // === 计算耗时 ===
                const ingTime = parseTime(flowTimes['ING']);
                const doneTime = parseTime(flowTimes['DONE']);
                const affirmTime = parseTime(flowTimes['AFFIRM']);
                const notTime = parseTime(flowTimes['NOT']);
                const statusTime = parseTime(order.statusTime); // AFFIRM确认完工时间

                // 暂停耗时总和（秒）
                let totalPauseSeconds = 0;
                for (const pair of pauseRecoverPairs) {
                    const pTime = parseTime(pair.pauseTime);
                    const rTime = parseTime(pair.recoverTime);
                    if (pTime && rTime && rTime > pTime) {
                        totalPauseSeconds += timeDiffSeconds(rTime, pTime);
                    }
                }
                result._totalPauseDuration = formatDuration(totalPauseSeconds);
                result._totalPauseSeconds = totalPauseSeconds;

                // 维修耗时：DONE - ING - 暂停时长（秒）
                if (ingTime && doneTime) {
                    const rawSeconds = timeDiffSeconds(doneTime, ingTime);
                    if (rawSeconds !== null) {
                        const actualSeconds = Math.max(0, rawSeconds - totalPauseSeconds);
                        result._repairDuration = formatDuration(actualSeconds);
                        result._repairDurationSeconds = actualSeconds;
                    } else {
                        result._repairDuration = '';
                        result._repairDurationSeconds = null;
                    }
                } else {
                    result._repairDuration = '';
                    result._repairDurationSeconds = null;
                }

                // 响应耗时：statusTime - ING时间（秒）
                if (ingTime && statusTime) {
                    const respSeconds = timeDiffSeconds(statusTime, ingTime);
                    result._responseDuration = formatDuration(respSeconds);
                    result._responseDurationSeconds = respSeconds;
                } else {
                    result._responseDuration = '';
                    result._responseDurationSeconds = null;
                }

                // 完工时间（DONE状态时间）
                result._doneTime = flowTimes['DONE'] || '';
                // 确认完工时间
                result._affirmTime = flowTimes['AFFIRM'] || order.doneAffirmAt || '';

                // 申报时间 = NOT时间
                result._notTime = flowTimes['NOT'] || order.createdAt || '';

                return result;
            }

            function parseAllOrders(rawData) {
                let orders = [];
                if (Array.isArray(rawData)) {
                    orders = rawData;
                } else if (typeof rawData === 'object' && rawData !== null) {
                    // 单条对象
                    orders = [rawData];
                } else {
                    throw new Error('数据格式错误：请输入JSON对象或数组');
                }
                if (orders.length === 0) {
                    throw new Error('数据为空，请检查输入');
                }
                return orders.map(o => parseSingleOrder(o));
            }

            // ==================== 收集所有工单中出现的操作流水列 ====================
            function collectFlowColumns(parsedOrders) {
                const singleStatusOrder = ['NOT', 'PEND', 'REPEND', 'ROB', 'WAIT', 'ING', 'DONE', 'AFFIRM', 'REVIEW',
                    'VISIT', 'BACK', 'URGE', 'ASSIST', 'CANCEL', 'FEEDBACK'
                ];
                const singleLabelMap = {
                    'NOT': '故障登记时间',
                    'PEND': '派工时间',
                    'REPEND': '重派工时间',
                    'ROB': '接单时间',
                    'WAIT': '转单时间',
                    'ING': '开始维修时间',
                    'DONE': '完工时间',
                    'AFFIRM': '确认完工时间',
                    'REVIEW': '维修评价时间',
                    'VISIT': '工单回访时间',
                    'BACK': '退回时间',
                    'URGE': '催单时间',
                    'ASSIST': '协助时间',
                    'CANCEL': '取消时间',
                    'FEEDBACK': '滞留反馈时间',
                };

                // 检查哪些状态在所有工单中出现过
                const appearedSingle = new Set();
                let maxPairs = 0;
                for (const order of parsedOrders) {
                    const ft = order._flowTimes;
                    for (const st of singleStatusOrder) {
                        if (ft[st] && ft[st].trim()) {
                            appearedSingle.add(st);
                        }
                    }
                    if (order._maxPairIndex > maxPairs) {
                        maxPairs = order._maxPairIndex;
                    }
                }

                // 按顺序构建列
                const columns = [];
                for (const st of singleStatusOrder) {
                    if (appearedSingle.has(st)) {
                        columns.push({
                            key: 'flow_' + st,
                            title: singleLabelMap[st] || st,
                            status: st,
                        });
                    }
                }
                // 挂起/恢复对
                for (let i = 1; i <= maxPairs; i++) {
                    const pauseKey = 'PAUSE_' + i;
                    const recoverKey = 'RECOVER_' + i;
                    // 检查是否有任何工单有该挂起/恢复时间
                    let hasPause = false;
                    let hasRecover = false;
                    for (const order of parsedOrders) {
                        if (order._flowTimes[pauseKey] && order._flowTimes[pauseKey].trim()) hasPause = true;
                        if (order._flowTimes[recoverKey] && order._flowTimes[recoverKey].trim()) hasRecover = true;
                    }
                    if (hasPause || hasRecover) {
                        columns.push({
                            key: 'flow_' + pauseKey,
                            title: '挂起时间' + i,
                            status: 'PAUSE',
                        });
                        columns.push({
                            key: 'flow_' + recoverKey,
                            title: '恢复时间' + i,
                            status: 'RECOVER',
                        });
                    }
                }
                return columns;
            }

                let theadHTML = '<thead><tr>';

                    theadHTML += `<th style="min-width:${col.width || '120px'}">${col.title}</th>`;
                }
                theadHTML += '</tr></thead>';

                let tbodyHTML = '<tbody>';
                for (const order of parsedOrders) {
                    tbodyHTML += '<tr>';
                    for (const col of allColumns) {
                        let val = '';
                        if (col.key.startsWith('flow_')) {
                            // 操作流水列
                            const flowKey = col.key.replace('flow_', '');
                            val = (order._flowTimes && order._flowTimes[flowKey]) ? order._flowTimes[flowKey] : '';
                        } else if (col.key === '_status') {
                            val = order[col.key] || '';
                        } else if (col.key === '_manhour') {

                        if (col.key === '_status') {

                            val = `<span class="status-badge ${cls}" style="font-size:11px;">${val}</span>`;
                        }
                        // 截断长文本
                        const displayVal = (typeof val === 'string' && val.length > 60 && !val.includes('<span')) ?
                            `<span title="${escapeHtml(val)}" class="cell-content">${escapeHtml(val.substring(0, 57))}...</span>` :
                            val;
                        tbodyHTML += `<td>${displayVal || ''}</td>`;
                    }
                    tbodyHTML += '</tr>';
                }
                tbodyHTML += '</tbody>';

                tableWrapper.innerHTML = `<table>${theadHTML}${tbodyHTML}</table>`;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 2600);
            }

                document.getElementById('jsonInput').value = '';

                parsedWorkOrders = [];
                dynamicFlowColumns = [];
                showToast('已清空全部数据', 'info');
            }

            // ==================== 全局暴露 ====================
            window.parseAndPreview = parseAndPreview;
            window.loadSampleData = loadSampleData;
            window.clearAll = clearAll;
            window.exportToExcel = exportToExcel;

            // ==================== 快捷键支持 ====================
            document.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    parseAndPreview();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
                    e.preventDefault();
                    if (!document.getElementById('btnExport').disabled) {
                        exportToExcel();
                    }
                }
            });

            // ==================== 初始化 ====================
            console.log('✅ 工单数据解析导出工具已就绪');
